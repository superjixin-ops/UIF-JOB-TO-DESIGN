[project]
name = "pipeline-copilot"
version = "0.1.0"
description = "把 UIF pipeline YAML 变成列级血缘设计文档的 Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.2",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.22",
    "numpy>=2.5.5",
    "openai>=3.55.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "sqlite-vec>=0.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
pdc = "pdc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdc"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
