[project]
name = "pipeline-copilot"
version = "0.1.0"
description = "UIF pipeline 与设计文档双向转换：正向确定性生成，反向模型生成 + 校验器判定"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.2",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.2.22",
    "numpy>=2.5.5",
    "openai>=3.55.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "sqlite-vec>=0.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
pdc = "pdc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdc"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "types-openpyxl>=3.1.5.20261122",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["pdc"]
# 没写类型注解的函数体也要检查：项目的注解是渐进的，
# 关掉这个会让一半模块实际上没被检查。
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# 这两个库没有 py.typed，也没有社区存根。
# 只对它们放开，避免全局 ignore_missing_imports 把真问题也吞掉。
module = ["sqlite_vec", "sqlite_vec.*", "fastembed", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的标准写法就是把 Depends(...) 放在参数默认值里。
# 不豁免的话每个端点都会报 B008，只能到处加 noqa。
extend-immutable-calls = ["fastapi.Depends"]
