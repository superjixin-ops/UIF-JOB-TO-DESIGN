# pgvector 演示环境：一条命令起一个带向量扩展的 Postgres
#
#   docker compose -f docker-compose.pg.yml up -d
#   export PDC_PGVECTOR_DSN="postgresql://postgres:pdc@localhost:5433/pdc"
#   uv run pdc index build --repo samples/pipelines --out out/index-pg --backend pgvector
#   uv run pdc search "订单履约" --index out/index-pg
#
# 端口用 5433，避免和本机已有的 Postgres 冲突。
services:
  pg:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: pdc
      POSTGRES_DB: pdc
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdc"]
      interval: 5s
      timeout: 3s
      retries: 10
