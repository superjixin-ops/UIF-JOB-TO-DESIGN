name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 真的起一个带 pgvector 的 Postgres：否则"适配器写完了"只是自我声明。
    services:
      pg:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: pdc
          POSTGRES_DB: pdc
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pdc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check pdc

      - name: Test
        env:
          PDC_TEST_PG_DSN: postgresql://postgres:pdc@localhost:5433/pdc
        run: uv run pytest -q

      # 只跑 pytest 不够：用例可能被 skip 掉，而 skip 也是绿。
      # 这一步要求 pgvector 集成用例必须真的 passed。
      - name: Verify pgvector test actually ran
        env:
          PDC_TEST_PG_DSN: postgresql://postgres:pdc@localhost:5433/pdc
        run: |
          uv run pytest tests/test_langchain_pg.py::test_pg_roundtrip -q | tee /tmp/pg.txt
          grep -q "1 passed" /tmp/pg.txt

      # 备份没演练过等于没有备份。这一步在 CI 里真的走一遍
      # 创建 -> 校验 -> 恢复，而不是只跑单测。
      - name: Backup drill
        run: |
          uv run python -c "from pdc.jobs import JobStore; JobStore('out/jobs.db')"
          uv run python -c "from pdc.audit_log import AuditLog; AuditLog('out/audit.db').append(actor='ci', role='admin', action='ci.smoke')"
          uv run pdc backup create --out /tmp/bk --keep 3
          ARCHIVE="$(ls /tmp/bk/backup-*.tar.gz | head -1)"
          uv run pdc backup verify --archive "$ARCHIVE"
          rm -rf /tmp/restore
          uv run pdc backup restore --archive "$ARCHIVE" --to /tmp/restore
          test -f /tmp/restore/jobs.db
          test -f /tmp/restore/audit.db
          uv run pdc audit-log verify --db /tmp/restore/audit.db

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        # 把完整输出写进 build.log：失败时下一步会把它贴到 job summary，
        # 这样没有 admin 权限的人也能在 check run 里看到错误原因。
        run: |
          set -o pipefail
          docker build -t pipeline-copilot:ci . 2>&1 | tee build.log

      - name: Surface build error
        if: failure()
        run: |
          # job summary 不进 check-run API，但 error 注解会。
          # 没有 admin 权限下载日志时，这是唯一能看到错误原因的公开通道。
          echo '### docker build failed' >> "$GITHUB_STEP_SUMMARY"
          grep -iE "error|failed|cannot|not found|no such" build.log | tail -8 |             while IFS= read -r line; do
              echo "::error::$line"
            done
          tail -30 build.log >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test image
        run: |
          docker run -d --name pdc-ci -p 8000:8000 pipeline-copilot:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "health ok"
              curl -fsS http://127.0.0.1:8000/health
              exit 0
            fi
            sleep 2
          done
          echo "容器启动失败，日志："
          docker logs pdc-ci
          exit 1
