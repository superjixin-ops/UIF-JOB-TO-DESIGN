name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check pdc

      - name: Test
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        # 把完整输出写进 build.log：失败时下一步会把它贴到 job summary，
        # 这样没有 admin 权限的人也能在 check run 里看到错误原因。
        run: |
          set -o pipefail
          docker build -t pipeline-copilot:ci . 2>&1 | tee build.log

      - name: Surface build error
        if: failure()
        run: |
          # job summary 不进 check-run API，但 error 注解会。
          # 没有 admin 权限下载日志时，这是唯一能看到错误原因的公开通道。
          echo '### docker build failed' >> "$GITHUB_STEP_SUMMARY"
          grep -iE "error|failed|cannot|not found|no such" build.log | tail -8 |             while IFS= read -r line; do
              echo "::error::$line"
            done
          tail -30 build.log >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test image
        run: |
          docker run -d --name pdc-ci -p 8000:8000 pipeline-copilot:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "health ok"
              curl -fsS http://127.0.0.1:8000/health
              exit 0
            fi
            sleep 2
          done
          echo "容器启动失败，日志："
          docker logs pdc-ci
          exit 1
