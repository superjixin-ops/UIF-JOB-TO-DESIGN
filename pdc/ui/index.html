<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pipeline Design Copilot</title>
<style>
  :root {
    --bg:#f7f9fc; --card:#fff; --ink:#1a1f2b; --muted:#667085;
    --line:#e4e9f2; --accent:#1f3864; --ok:#0f7b3f; --warn:#b54708; --err:#b42318;
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"PingFang SC",Segoe UI,sans-serif;
         background:var(--bg); color:var(--ink); }
  header { background:var(--accent); color:#fff; padding:16px 24px; }
  header h1 { margin:0; font-size:17px; font-weight:600; letter-spacing:.3px; }
  header p { margin:4px 0 0; font-size:12px; opacity:.75; }
  main { max-width:1080px; margin:0 auto; padding:24px; display:grid;
         grid-template-columns: 340px 1fr; gap:20px; }
  @media (max-width: 860px){ main{ grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card h2 { margin:0 0 12px; font-size:13px; text-transform:uppercase;
             letter-spacing:.08em; color:var(--muted); font-weight:600; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  select,input { width:100%; padding:8px 10px; border:1px solid var(--line);
                 border-radius:7px; font:inherit; background:#fff; }
  button { margin-top:14px; width:100%; padding:10px; border:0; border-radius:7px;
           background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.ghost { background:#fff; color:var(--accent); border:1px solid var(--line); }
  .row { display:flex; gap:8px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
  .stat { background:#f2f5fb; border-radius:8px; padding:8px 10px; }
  .stat b { display:block; font-size:18px; color:var(--accent); }
  .stat span { font-size:11px; color:var(--muted); }
  #timeline { list-style:none; margin:0; padding:0; max-height:460px; overflow:auto; }
  #timeline li { display:grid; grid-template-columns:26px 64px 1fr auto;
                 gap:8px; align-items:center; padding:7px 8px;
                 border-bottom:1px solid var(--line); font-size:12.5px; }
  #timeline li:last-child { border-bottom:0; }
  .kind { font-size:10px; text-align:center; border-radius:4px; padding:2px 0;
          background:#eef2f9; color:var(--accent); font-weight:600; }
  .kind.tool { background:#e8f5ec; color:var(--ok); }
  .kind.safety { background:#fdecea; color:var(--err); }
  .ms { color:var(--muted); font-variant-numeric:tabular-nums; }
  .empty { color:var(--muted); font-size:12.5px; padding:20px 0; text-align:center; }
  #status { font-size:12px; color:var(--muted); margin-top:10px; }
  .badge { display:inline-block; padding:1px 7px; border-radius:999px;
           font-size:11px; font-weight:600; }
  .badge.succeeded { background:#e8f5ec; color:var(--ok); }
  .badge.running,.badge.queued { background:#fff4e5; color:var(--warn); }
  .badge.failed,.badge.cancelled { background:#fdecea; color:var(--err); }
  .files a { display:block; font-size:12.5px; color:var(--accent); margin-top:6px; }
  pre { background:#0f172a; color:#e2e8f0; padding:12px; border-radius:8px;
        font-size:12px; overflow:auto; max-height:260px; white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>Pipeline Design Copilot</h1>
  <p id="sub">读取流水线配置，生成设计文档并自检</p>
</header>

<main>
  <section class="card">
    <h2>新建任务</h2>
    <label for="pipeline">流水线</label>
    <select id="pipeline"></select>

    <label for="mode">模式</label>
    <select id="mode">
      <option value="offline">offline（不调模型，免费）</option>
      <option value="auto">auto（真实模型）</option>
    </select>

    <label for="token">API Token（服务端配了才需要）</label>
    <input id="token" type="password" placeholder="留空则不带鉴权头" />

    <div class="row">
      <button id="run">开始</button>
      <button id="cancel" class="ghost" disabled>取消</button>
    </div>

    <div id="status">尚未运行</div>

    <div class="stats">
      <div class="stat"><b id="s-steps">0</b><span>步骤</span></div>
      <div class="stat"><b id="s-tok">0</b><span>tokens</span></div>
      <div class="stat"><b id="s-ms">0</b><span>耗时 ms</span></div>
    </div>

    <div class="files" id="files"></div>
  </section>

  <section class="card">
    <h2>执行轨迹</h2>
    <ul id="timeline"><li class="empty">还没有步骤</li></ul>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let runId = null, es = null, started = 0;

function authHeaders() {
  const t = $('token').value.trim();
  return t ? { 'Authorization': 'Bearer ' + t } : {};
}

async function loadPipelines() {
  try {
    const r = await fetch('/pipelines', { headers: authHeaders() });
    if (!r.ok) throw new Error(r.status === 401 ? '需要 token' : r.status);
    const data = await r.json();
    $('pipeline').innerHTML = data.pipelines
      .map(n => `<option value="${n}">${n}</option>`).join('');
  } catch (e) {
    $('pipeline').innerHTML = `<option>加载失败：${e.message}</option>`;
  }
}

function addStep(s) {
  const list = $('timeline');
  if (list.querySelector('.empty')) list.innerHTML = '';

  const li = document.createElement('li');
  const kind = s.kind === 'tool' ? 'tool' : (s.kind === 'safety' ? 'safety' : '');
  const tok = (s.tokens_in || 0) + (s.tokens_out || 0);
  li.innerHTML = `
    <span class="kind ${kind}">${s.kind}</span>
    <span>${(s.name || '').slice(0, 14)}</span>
    <span>${s.error ? '<span style="color:#b42318">' + s.error.slice(0,60) + '</span>' : ''}</span>
    <span class="ms">${s.latency_ms || 0}ms${tok ? ' · ' + tok + 'tok' : ''}</span>`;
  list.appendChild(li);
  list.scrollTop = list.scrollHeight;

  const anyTok = [...list.children].reduce((a, el) => a + (parseInt(el.textContent.match(/· (\d+)tok/)?.[1] || 0)), 0);
  $('s-tok').textContent = anyTok;
}

function watch(id) {
  // EventSource 不能自定义请求头，token 只能走 query。
  // 生产上应该改成短期签名 URL，避免 token 进 access log。
  const t = $('token').value.trim();
  const q = t ? `?token=${encodeURIComponent(t)}` : '';
  es = new EventSource(`/runs/${id}/stream${q}`);
  es.onmessage = (ev) => {
    const d = JSON.parse(ev.data);
    if (d.kind === 'done') {
      finish(d.status, d.files || {});
      return;
    }
    addStep(d);
    $('s-steps').textContent = Number($('s-steps').textContent) + 1;
    $('s-ms').textContent = Date.now() - started;
  };
  es.onerror = () => { /* 服务端关闭时浏览器会自动重连，这里忽略 */ };
}

async function finish(status, files) {
  if (es) { es.close(); es = null; }
  $('run').disabled = false;
  $('cancel').disabled = true;
  $('status').innerHTML = `状态：<span class="badge ${status}">${status}</span>`;
  $('files').innerHTML = Object.entries(files)
    .map(([k, v]) => {
      const name = String(v).split('/').pop();
      return `<a href="/files/${encodeURIComponent(name)}" target="_blank">下载 ${k} · ${name}</a>`;
    }).join('');
}

$('run').onclick = async () => {
  $('timeline').innerHTML = '<li class="empty">等待第一步…</li>';
  $('s-steps').textContent = '0'; $('s-tok').textContent = '0'; $('s-ms').textContent = '0';
  $('files').innerHTML = ''; $('status').textContent = '提交中…';
  $('run').disabled = true; $('cancel').disabled = false;
  started = Date.now();

  try {
    const r = await fetch('/runs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ pipeline: $('pipeline').value, mode: $('mode').value }),
    });
    if (!r.ok) {
      const t = await r.text();
      throw new Error(r.status + ' ' + t.slice(0, 120));
    }
    const data = await r.json();
    runId = data.run_id;
    $('status').textContent = '已排队，run_id=' + runId;
    watch(runId);
  } catch (e) {
    $('status').textContent = '提交失败：' + e.message;
    $('run').disabled = false; $('cancel').disabled = true;
  }
};

$('cancel').onclick = async () => {
  if (!runId) return;
  await fetch(`/runs/${runId}/cancel`, { method: 'POST', headers: authHeaders() });
  $('status').textContent = '已请求取消，当前步骤结束后停止';
};

loadPipelines();
</script>
</body>
</html>
