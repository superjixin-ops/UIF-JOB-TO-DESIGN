# Fly.io 部署配置：fly launch --no-deploy 之后用这个覆盖
app = "pipeline-copilot"
primary_region = "nrt"   # 东京，国内访问相对快；也可改 "sin" 新加坡

[build]
  dockerfile = "Dockerfile"

[env]
  PDC_RAG_MODE = "bm25"        # 容器里不下载 100MB 向量模型，RAG 走 BM25
  PDC_MAX_CONCURRENCY = "2"    # 小机器，限流保守一点

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"   # 没人访问就停，省钱
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
